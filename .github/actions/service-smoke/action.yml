name: Service smoke
description: "Install the last release in an installation mode, upgrade it to this build and launch an implant, against a mock platform"

inputs:
  mode:
    description: "Installation mode: service, service-user, session-user, or session-user-non-elevated (Windows session-user as a standard user)"
    required: true
  os:
    description: "Runner OS family: ubuntu, windows or macos"
    required: true
  arch:
    description: "Architecture: x86_64 or arm64"
    required: true
  jfrog_path:
    description: "Artifact folder of the build (e.g. linux/x86_64)"
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Download binary artifact
      uses: actions/download-artifact@v8
      with:
        name: agent-bin-${{ inputs.os }}-${{ inputs.arch }}
        path: smoke

    # Bash puts Git's openssl on PATH on Windows too; the mock signs with it.
    - name: Install, upgrade to this build and launch an implant
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        # The non-elevated variant is the session-user script with an argument.
        script="agent-${MODE%-non-elevated}-smoke.py"
        variant=""
        if [[ $MODE == *-non-elevated ]]; then variant="non-elevated"; fi
        python ".github/scripts/$script" "smoke/${{ inputs.jfrog_path }}" $variant
