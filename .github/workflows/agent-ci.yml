name: "[Agent] CI"

# Continuous Integration pipeline.
# ⚠️ Branch-protection status check: "pipeline / ✅ Pipeline Gate"

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    secrets: inherit
