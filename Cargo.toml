[package]
name = "openaev-agent"
version = "3.261029.0"
edition = "2021"

[dependencies]
config = "0.15.0"
hostname = "0.4.0"
network-interface = "2.0.3"
mid = "=3.0.7"
tracing-appender = "0.2.3"
rolling-file = "0.2.0"
webpki-root-certs = "1.0.10"
bytes = "1.12.1"

[dependencies.reqwest]
version = "0.13.0"
features = [
    "blocking",
    "rustls",
    "json",
]
default-features = false

[dependencies.zeroize]
version = "1.9.0"
features = [
    "serde",
]

[dependencies.toml_edit]
version = "0.25.17"
features = [
    "parse",
    "display",
]
default-features = false

[dependencies.serde]
version = "1.0.203"
features = [
    "derive",
]

[dependencies.serde_json]
version = "1.0.140"

[dependencies.log]
version = "0.4.22"
features = [
    "kv",
]

[dependencies.tracing-subscriber]
version = "0.3.18"
features = [
    "json",
]

[target."cfg(windows)".dependencies]
windows-service = "0.8.0"
windows-service-detector = "0.1.0"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]
filetime = "0.2.25"
mockito = "1.7.0"
